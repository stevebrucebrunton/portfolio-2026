<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Steve Brunton</title>
    <meta name="description" content="Get in touch with Steve Brunton for freelance and full-time graphic design inquiries in Toronto.">
    
    <meta property="og:title" content="Contact | Steve Brunton">
    <meta property="og:description" content="Get in touch with Steve Brunton for freelance and full-time graphic design inquiries in Toronto.">
    <meta property="og:image" content="https://www.stevebrunton.com/images/headshot.png">
    <meta property="og:url" content="https://www.stevebrunton.com/contact.html">
    
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preload" as="image" href="images/bg2.avif">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-layer"></div>

    <div class="site-wrapper">
        <header>
            <div class="logo-container">
                <a href="index.html">
                    <img src="images/logo1.svg" class="main-logo" alt="Steve Brunton Logo">
                </a>
            </div>
            <nav class="main-nav">
                <a href="index.html">Work</a>
                <a href="about.html">About</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
        </header>
        <main>
            <section class="contact-section">
                <form id="contact-form" class="contact-form" method="POST">
                    <input type="text" name="_honey" style="display:none">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_subject" value="New message from SteveBrunton.com">

                    <div class="form-group"><label for="name">Name</label><input type="text" id="name" name="name" required></div>
                    <div class="form-group"><label for="email">Email</label><input type="email" id="email" name="email" required></div>
                    <div class="form-group"><label for="message">Message</label><textarea id="message" name="message" rows="6" required></textarea></div>
                    <button type="submit" class="submit-btn">Send</button>
                </form>

                <div id="success-message" style="display:none;">
                    <h3>Sent</h3>
                </div>
            </section>
        </main>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
