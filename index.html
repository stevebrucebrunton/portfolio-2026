<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work | Steve Brunton</title>
    <meta name="description" content="Portfolio of Steve Brunton, a Toronto-based graphic designer specializing in minimalist and illustrative design.">
    
    <meta property="og:title" content="Work | Steve Brunton">
    <meta property="og:description" content="Portfolio of Steve Brunton, a Toronto-based graphic designer specializing in minimalist and illustrative design.">
    <meta property="og:image" content="https://www.stevebrunton.com/images/headshot.png">
    <meta property="og:url" content="https://www.stevebrunton.com">
    
    <link rel="icon" type="image/png" href="images/favicon.png">
    
    <link rel="preload" as="image" href="images/bg2.avif">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-layer"></div>

    <div class="site-wrapper">
        <header>
            <div class="logo-container">
                <a href="index.html">
                    <img src="images/logo1.svg" class="main-logo" alt="Steve Brunton Logo">
                </a>
            </div>
            <nav class="main-nav" aria-label="Main Navigation">
                <a href="index.html" class="active">Work</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
        </header>

        <main>
            <div class="gallery-grid">
                <div class="gallery-item" tabindex="0" role="img" aria-label="The Met Rentals catalogue" style="background-image: url('images/thumb1.png');" data-src="images/mr1.avif, images/mr2.avif, images/mr3.avif, images/mr4.avif, images/mr5.avif, images/mr6.avif, images/mr7.avif" data-title="The Met Rentals" data-desc="Concept catalogue layout"></div>
                
                <div class="gallery-item" tabindex="0" role="img" aria-label="Rawhead Rex poster" style="background-image: url('images/thumb2.png');" data-src="images/image2.avif" data-title="RAWHEAD REX RETROSPECTIVE POSTER" data-desc="A spec poster designed for a Clive Barker film retrospective at the Revue Cinema in Toronto."></div>
                
                <div class="gallery-item" tabindex="0" role="img" aria-label="Monster Gospel album cover" style="background-image: url('images/thumb3.png');" data-src="images/image3.avif" data-title="Monster Gospel" data-desc="Album cover design"></div>
                
                <div class="gallery-item" tabindex="0" role="img" aria-label="Teeth Eaters illustration" style="background-image: url('images/thumb4.png');" data-src="images/image4.avif" data-title="Teeth Eaters" data-desc="Editorial illustration"></div>
                
                <div class="gallery-item" tabindex="0" role="img" aria-label="The Picture of Dorian Gray cover" style="background-image: url('images/thumb5.png');" data-src="images/image5.avif" data-title="The Picture of Dorian Gray" data-desc="Book cover concept"></div>
                
                <div class="gallery-item" tabindex="0" role="img" aria-label="Red BG with blocky lettering reads Faust, with Goethe underneath in smaller text" style="background-image: url('images/thumb6.png');" data-src="images/image6.avif" data-title="Faust" data-desc="Book cover concept"></div>
                
                <div class="gallery-item" tabindex="0" role="img" aria-label="Starbucks ad concept" style="background-image: url('images/thumb7.png');" data-src="images/image7.avif" data-title="They Still Suck" data-desc="Ad concept"></div>
                
                <div class="gallery-item" tabindex="0" role="img" aria-label="Night of the Living Dead poster" style="background-image: url('images/thumb8.png');" data-src="images/image8.avif" data-title="NIGHT OF THE LIVING DEAD" data-desc="Movie poster concept"></div>
            </div>
        </main>
    </div>

    <div id="lightbox" class="lightbox-container" role="dialog" aria-modal="true">
        <span class="close-btn" tabindex="0" role="button" aria-label="Close Project Viewer">&times;</span>
        <span class="nav-btn prev-btn" tabindex="0" role="button" aria-label="Previous Project">&#10094;</span>
        <span class="nav-btn next-btn" tabindex="0" role="button" aria-label="Next Project">&#10095;</span>
        <div class="lightbox-content">
            <div class="project-text">
                <h3 id="project-title"></h3>
                <p id="project-desc"></p>
            </div>
            <img id="lightbox-img" src="images/mr1.avif" alt="Detailed view">
            <div id="page-counter"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
