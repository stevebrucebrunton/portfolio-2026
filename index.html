<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steve Brunton | Graphic Design & Illustration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <h1>Steve Brunton</h1>
        <nav>
            <a href="#work">Work</a>
            <a href="#about">About</a>
        </nav>
    </header>

    <main id="work">
        <div class="gallery-grid">
            <!-- Add your project thumbnails here. Data attributes feed the lightbox. -->
            <article class="project-card" data-index="0" data-title="Rawhead Rex" data-desc="Spec poster utilizing RL Aqva font and a smoky coral palette with a brutalist layout.">
                <img src="images/rawhead-thumb.jpg" alt="Rawhead Rex Poster" data-full="images/rawhead-full.jpg">
            </article>

            <article class="project-card" data-index="1" data-title="Met Rentals" data-desc="Art catalogue featuring minimalist baroque styling and photo-manipulated party scenes.">
                <img src="images/met-thumb.jpg" alt="Met Rentals Catalogue" data-full="images/met-full.jpg">
            </article>

            <article class="project-card" data-index="2" data-title="Iron Kettle" data-desc="Tea packaging with a muted olive and chocolate palette, focused on a health-store aesthetic.">
                <img src="images/ironkettle-thumb.jpg" alt="Iron Kettle Packaging" data-full="images/ironkettle-full.jpg">
            </article>

            <article class="project-card" data-index="3" data-title="Milkweed" data-desc="Concert poster channeling a medieval British woodcut style through scanned ink textures.">
                <img src="images/milkweed-thumb.jpg" alt="Milkweed Poster" data-full="images/milkweed-full.jpg">
            </article>
        </div>
    </main>

    <!-- Lightbox Overlay -->
    <div id="lightbox" class="lightbox-container" role="dialog" aria-modal="true">
        <span class="close-btn" tabindex="0" role="button" aria-label="Close Project Viewer">&times;</span>
        <span class="nav-btn prev-btn" tabindex="0" role="button" aria-label="Previous Project">&#10094;</span>
        <span class="nav-btn next-btn" tabindex="0" role="button" aria-label="Next Project">&#10095;</span>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Detailed view">
            <div class="project-text">
                <h3 id="project-title"></h3>
                <p id="project-desc"></p>
            </div>
            <div id="page-counter"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
