<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steve Brunton | Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-layer"></div>
    
    <div class="site-wrapper">
        <header>
            <div class="logo-container">
                <!-- Replace with your actual logo path -->
                <img src="images/logo.png" alt="Steve Brunton" class="main-logo">
            </div>
            <nav class="main-nav">
                <a href="index.html" class="active">Work</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
        </header>

        <main>
            <div class="gallery-grid loaded">
                
                <!-- Image 1 -->
                <div class="gallery-item" style="background-image: url('images/image1.jpg');" 
                     data-title="MILKWEED CONCERT POSTER" 
                     data-desc="Medieval British woodcut style poster featuring scanned ink textures.">
                </div>
                
                <!-- Image 2 -->
                <div class="gallery-item" style="background-image: url('images/image2.jpg');" 
                     data-title="RAWHEAD REX 35MM RETROSPECTIVE POSTER" 
                     data-desc="A spec poster designed for a Clive Barker film retrospective at the Revue Cinema in Toronto.">
                </div>

                <!-- Image 3 -->
                <div class="gallery-item" style="background-image: url('images/image3.jpg');" 
                     data-title="IRON KETTLE TEA PACKAGING" 
                     data-desc="Brand identity and packaging concept utilizing a muted olive and chocolate palette with a front-dispensing punch-out.">
                </div>

                <!-- Image 4 -->
                <div class="gallery-item" style="background-image: url('images/image4.jpg');" 
                     data-title="TORONTO AFTER DARK LOGO" 
                     data-desc="Festival logo redesign featuring an eye motif, retro starbursts, and a desaturated blood-pink color scheme.">
                </div>

                <!-- Image 5 -->
                <div class="gallery-item" style="background-image: url('images/image5.jpg');" 
                     data-title="DORIAN GRAY BOOK COVERS" 
                     data-desc="Cover designs exploring the theme of duality with ornate gold contrasting against weathered grey.">
                </div>

                <!-- Image 6 -->
                <div class="gallery-item" style="background-image: url('images/image6.jpg');" 
                     data-title="FAUST BOOK COVER" 
                     data-desc="Dark charcoal cover featuring a red devil silhouette and thick sans-serif typography.">
                </div>

                <!-- Image 7 -->
                <div class="gallery-item" style="background-image: url('images/image7.jpg');" 
                     data-title="MET RENTALS ART CATALOGUE" 
                     data-desc="Minimalist baroque style catalogue spread featuring photo-manipulated party scenes.">
                </div>

                <!-- Image 8 -->
                <div class="gallery-item" style="background-image: url('images/image8.jpg');" 
                     data-title="NIGHT OF THE LIVING DEAD" 
                     data-desc="Spec poster design for the classic horror film, utilizing heavy textures, high contrast elements, and stark typography.">
                </div>

            </div>
        </main>
    </div>

    <!-- Lightbox -->
    <div class="lightbox-container" id="lightbox">
        <span class="close-btn">&times;</span>
        <span class="nav-btn prev-btn">&#10094;</span>
        
        <div class="lightbox-content">
            <div class="project-text">
                <h3 id="project-title"></h3>
                <p id="project-desc"></p>
                <div id="page-counter"></div>
            </div>
            <img id="lightbox-img" src="" alt="Project View">
        </div>
        
        <span class="nav-btn next-btn">&#10095;</span>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
